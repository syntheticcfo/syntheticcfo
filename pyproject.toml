[build-system]
# 77 is the first setuptools that reads an SPDX licence expression and
# license-files (PEP 639); an older one refuses the string form below
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syntheticcfo"
version = "0.2.2"
description = "Python client for synthetic cfo: forensic-grade synthetic ERP data (SAP ECC, SAP S/4HANA, Oracle Cloud) with a labelled fraud answer key."
readme = "README.md"
requires-python = ">=3.8"
# MIT, the client, its command line and its MCP server alike; the data they
# generate stays under each plan's terms. No licence classifier: setuptools
# refuses one beside an SPDX expression.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "synthetic cfo" }]
keywords = ["synthetic data", "erp", "sap", "oracle", "fraud detection", "audit", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
syntheticcfo = "syntheticcfo:main"

[project.urls]
Homepage = "https://app.syntheticcfo.com"
Documentation = "https://app.syntheticcfo.com/evaluate"
Source = "https://github.com/syntheticcfo/syntheticcfo"
Proof = "https://app.syntheticcfo.com/proof"

[tool.setuptools]
py-modules = ["syntheticcfo"]
